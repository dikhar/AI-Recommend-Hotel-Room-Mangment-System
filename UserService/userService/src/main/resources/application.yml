
spring:
  application:
    name: USER-SERVICE
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/user_db}

openai:
  # Configure as the OPENAI_API_KEY environment variable; never commit a key.
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5.6}

recommendation:
  # Set false to keep the same API while using only local history-based ranking.
  ai-enabled: ${AI_RECOMMENDATION_ENABLED:true}
#  eureka:
#    instance:
#      prefer-ip-address: true
#    client:
#      register-with-eureka: true
#      fetch-registry: true
#      service-url:
#        defaultZone: http://localhost:8788


#actuator config
management:
  health:
    circuit-breakers:
      enabled: true

    endpoints:
      web:
        exposure:
          include:
            health

    endpoint:
      health:
        show-details:
          always


#Resiliance 4j config
resilience4j.circuitbreaker:
  configs:
    default:
      registerHealthIndicator: true
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 5s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10

